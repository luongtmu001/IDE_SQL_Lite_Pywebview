<!-- Reconnect Password Modal -->
<div class="modal fade" id="reconnectPasswordModal" tabindex="-1" aria-labelledby="reconnectPasswordModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <form id="reconnectPasswordForm" class="modal-content ide-modal-content" method="post" action="javascript:void(0);" autocomplete="off">
            <div class="modal-header py-2 px-3">
                <h5 class="modal-title fs-6" id="reconnectPasswordModalLabel">
                    <i class="fa-solid fa-key me-2 text-warning"></i>Connect to Database
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body py-3 px-3">
                <!-- Connection Information Summary Card -->
                <div class="p-2 mb-3 rounded" style="background: var(--ide-bg-sidebar, #1e1e1e); border: 1px solid var(--ide-border, #333); font-size: 12px;">
                    <div class="row g-1 mb-1">
                        <div class="col-4 text-muted">Connection:</div>
                        <div class="col-8 fw-semibold text-truncate" id="reconnectConnName">-</div>
                    </div>
                    <div class="row g-1 mb-1">
                        <div class="col-4 text-muted">Server / Host:</div>
                        <div class="col-8 fw-semibold text-truncate" id="reconnectConnHost">-</div>
                    </div>
                    <div class="row g-1 mb-1" id="reconnectConnPortRow" style="display: none;">
                        <div class="col-4 text-muted">Port:</div>
                        <div class="col-8 fw-semibold" id="reconnectConnPort">-</div>
                    </div>
                    <div class="row g-1">
                        <div class="col-4 text-muted">Username:</div>
                        <div class="col-8 fw-semibold text-truncate" id="reconnectConnUser">-</div>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-2">
                    <label for="reconnectPassInput" class="ide-form-label mb-1">
                        Password <span class="text-danger">*</span>
                    </label>
                    <div class="input-group input-group-sm">
                        <input type="password" 
                               name="password"
                               class="form-control form-control-sm" 
                               id="reconnectPassInput" 
                               placeholder="Enter password..." 
                               autocomplete="new-password"
                               data-lpignore="true"
                               spellcheck="false">
                        <button class="btn btn-outline-secondary" 
                                type="button" 
                                id="btnToggleReconnectPass" 
                                title="Show/Hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Security / Storage Notice -->
                <div class="form-text small mt-2" style="font-size: 11px; color: var(--ide-text-dim, #888); line-height: 1.4;">
                    <i class="fa-solid fa-shield-halved me-1 text-info"></i>
                    Mật khẩu chỉ được lưu tạm trong bộ nhớ RAM phiên làm việc của server và không lưu vĩnh viễn trên ổ cứng vì lý do bảo mật.
                </div>

                <!-- Inline Error Alert -->
                <div class="alert alert-danger py-1 px-2 mt-2 mb-0 d-none small" id="reconnectPassError" style="font-size: 12px;"></div>
            </div>

            <div class="modal-footer py-2 px-3">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-sm btn-primary" id="btnConfirmReconnect">
                    <i class="fa-solid fa-plug me-1"></i>Connect
                </button>
            </div>
        </form>
    </div>
</div>
