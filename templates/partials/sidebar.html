<!-- Sidebar / Object Explorer -->
<div class="ide-sidebar d-flex flex-column" id="ide-sidebar" style="width: 260px;">
    <div class="ide-sidebar-header d-flex justify-content-between align-items-center px-2 py-1">
        <span class="ide-sidebar-header-title">
            Object Explorer
        </span>
        <div class="d-flex gap-1 align-items-center ide-sidebar-actions">
            <button id="ide-btn-connect" class="ide-toolbar-btn" title="New Connection">
                <i class="fa-solid fa-plug"></i>
            </button>
            <button id="ide-btn-new-group" class="ide-toolbar-btn" title="New Group">
                <i class="fa-solid fa-folder-plus"></i>
            </button>
            <button id="ide-btn-filter-db" class="ide-toolbar-btn" title="Filter Databases">
                <i class="fa-solid fa-filter"></i>
            </button>
            <button id="ide-btn-refresh-tree" class="ide-toolbar-btn" title="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button id="ide-sidebar-toggle-btn" class="ide-toolbar-btn" title="Thu gọn Object Explorer">
                <i class="fa-solid fa-angles-left"></i>
            </button>
        </div>
    </div>

    <!-- Object Explorer Quick Search / Filter Bar -->
    <div class="ide-sidebar-search px-2" id="ide-sidebar-search-container">
        <div class="ide-search-box position-relative d-flex align-items-center">
            <i class="fa-solid fa-magnifying-glass ide-search-icon"></i>
            <input type="text" class="form-control form-control-sm ide-search-input"
                id="ide-explorer-search-input" placeholder="Search objects..." autocomplete="off"
                spellcheck="false" title="Search objects in tree (gõ để lọc object)">
            <button class="btn btn-link ide-search-clear-btn d-none" type="button"
                id="ide-explorer-search-clear" title="Clear filter (Xóa lọc)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Collapsed Rail: shows only representative connection icons when collapsed -->
    <div id="ide-sidebar-collapsed-rail" class="ide-sidebar-collapsed-rail d-none flex-column align-items-center py-2 gap-2 overflow-auto flex-grow-1">
        <!-- Dynamically populated by explorer.js -->
    </div>

    <div class="ide-tree flex-grow-1 overflow-auto py-1">
        <ul id="ide-tree-root" class="list-unstyled mb-0 ps-0">
            <!-- Dynamically populated by explorer.js -->
        </ul>
    </div>
</div>

<!-- Sidebar Drag Resizer -->
<div class="ide-sidebar-resizer" id="ide-sidebar-resizer" title="Drag to resize"></div>

<!-- Sidebar Reopen Button (visible only when sidebar is collapsed) -->
<button class="ide-sidebar-reopen d-none" id="ide-sidebar-reopen" aria-label="Open Object Explorer" title="Open Object Explorer">
    <i class="fa-solid fa-angles-right"></i>
</button>
