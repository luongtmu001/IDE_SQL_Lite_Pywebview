<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luoBTool IDE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 500px;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #14796a;
            background: linear-gradient(135deg, #093c35 0%, #0e564b 35%, #14796a 75%, #1b9684 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-card {
            width: 800px;
            height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 40px;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.45);
        }

        .ambient-glow {
            position: absolute;
            width: 520px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 121, 106, 0.45) 0%, rgba(14, 86, 75, 0.15) 50%, rgba(9, 60, 53, 0) 70%);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -58%);
        }

        .logo-badge {
            width: 560px;
            height: 250px;
            background: #f0f9f8;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 35px rgba(20, 121, 106, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px 16px;
            display: block;
        }

        .app-slogan {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            z-index: 1;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .progress-track {
            width: 360px;
            height: 4px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 14px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            position: absolute;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #14796a, #2ec4b6, #80cbc4);
            border-radius: 4px;
            animation: progressSlide 1.6s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(46, 196, 182, 0.85);
        }

        @keyframes progressSlide {
            0% {
                left: -40%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: -40%;
            }
        }

        .splash-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 14px;
            z-index: 1;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .mini-spinner {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #2ec4b6;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .version-tag {
            position: absolute;
            bottom: 14px;
            right: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.4px;
        }
    </style>
</head>

<body>
    <div class="splash-card">
        <div class="ambient-glow"></div>
        <div class="logo-badge">
            <img src="../static/image/banner_full.png" onerror="this.src='../_concept_/banner_full.png'" alt="LLTool"
                class="banner-img">
        </div>
        <!-- <div class="app-slogan">Môi trường phát triển & Quản trị Cơ sở dữ liệu</div> -->
        <div class="app-slogan">Ae sá sà đi chôi côn via lá là</div>
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>
        <div class="splash-footer">
            <div class="mini-spinner"></div>
            <span>Đang khởi tạo môi trường làm việc và nạp kết nối...</span>
        </div>
        <div class="version-tag">Desktop Edition</div>
    </div>
</body>

</html>
