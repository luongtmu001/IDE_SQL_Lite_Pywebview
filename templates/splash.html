<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luoBTool IDE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 500px;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #071324 0%, #0d2745 40%, #0a3d75 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-card {
            width: 800px;
            height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 40px;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.45);
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25, 118, 210, 0.28) 0%, rgba(13, 71, 161, 0) 70%);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -58%);
        }

        .logo-badge {
            width: 560px;
            height: 250px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(25, 118, 210, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px 16px;
            display: block;
        }

        .app-slogan {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            z-index: 1;
        }

        .progress-track {
            width: 360px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 14px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            position: absolute;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #42a5f5, #90caf9, #42a5f5);
            border-radius: 4px;
            animation: progressSlide 1.6s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(66, 165, 245, 0.8);
        }

        @keyframes progressSlide {
            0% {
                left: -40%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: -40%;
            }
        }

        .splash-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 14px;
            z-index: 1;
        }

        .mini-spinner {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #64b5f6;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .version-tag {
            position: absolute;
            bottom: 14px;
            right: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.4px;
        }
    </style>
</head>
