<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So sánh — luoBTool IDE</title>

    <!-- Immediate Theme & Typography Restore -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ide-theme');
                if (saved) {
                    document.documentElement.setAttribute('data-bs-theme', saved);
                }
                var fontFam = localStorage.getItem('ide-ui-font-family');
                var fontSz = localStorage.getItem('ide-ui-font-size');
                if (fontFam) {
                    var stack = fontFam;
                    if (fontFam === 'Segoe UI') stack = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
                    else if (fontFam === 'Inter') stack = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif";
                    else if (fontFam === 'Roboto') stack = "'Roboto', 'Segoe UI', Arial, sans-serif";
                    else if (fontFam === 'Arial') stack = "Arial, 'Helvetica Neue', Helvetica, sans-serif";
                    else if (fontFam === 'Tahoma') stack = "Tahoma, Verdana, 'Segoe UI', sans-serif";
                    else if (fontFam === 'System UI') stack = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                    document.documentElement.style.setProperty('--ide-ui-font-family', stack);
                    document.documentElement.style.setProperty('--bs-body-font-family', stack);
                }
                if (fontSz) {
                    var szNum = parseInt(fontSz, 10);
                    if (!isNaN(szNum) && szNum >= 10 && szNum <= 24) {
                        document.documentElement.style.setProperty('--ide-ui-font-size', szNum + 'px');
                        document.documentElement.style.setProperty('--bs-body-font-size', szNum + 'px');
                    }
                }
            } catch (e) { }
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="../static/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../static/vendor/fontawesome/all.min.css">

    <!-- IDE Theme Variables & Schema Compare Styles -->
    <link rel="stylesheet" href="../static/css/theme-variables.css">
    <link rel="stylesheet" href="../static/css/themes.css">
    <link rel="stylesheet" href="../static/css/editor.css">
    <link rel="stylesheet" href="../static/css/schema-compare.css">
</head>

<body class="schema-compare-body">
    <div id="schema-compare-standalone-root" class="schema-compare-root"></div>

    <!-- Vendor Scripts -->
    <script src="../static/vendor/bootstrap/bootstrap.bundle.min.js"></script>

    <!-- Monaco Editor AMD Loader & Dialect Setup -->
    <script src="../static/vendor/monaco/vs/loader.js"></script>
    <script src="../static/js/monaco-init.js"></script>
    <script src="../static/js/monaco-sql-lang.js"></script>

    <!-- App Scripts -->
    <script src="../static/js/utils.js"></script>
    <script src="../static/js/api.js"></script>
    <script src="../static/js/clipboard-bridge.js"></script>
    <script src="../static/js/storage.js"></script>
    <script src="../static/js/theme-registry.js"></script>
    <script src="../static/js/theme.js"></script>
    <script src="../static/js/typography.js"></script>
    <script src="../static/js/schema-compare.js"></script>

    <script>
        window.onSettingsChanged = function (settings) {
            try {
                var theme = (settings && settings.appearance && settings.appearance.theme) || (settings && settings.theme) || 'dark';
                document.documentElement.setAttribute('data-bs-theme', theme);
                if (window.ThemeManager) {
                    window.ThemeManager.applyTheme(theme, false);
                }
                if (window.MonacoInit && typeof monaco !== 'undefined' && monaco.editor) {
                    monaco.editor.setTheme(window.MonacoInit.getMonacoTheme(theme));
                }
                if (window.TypographyManager && settings && settings.appearance) {
                    window.TypographyManager.apply({
                        fontFamily: settings.editor && settings.editor.fontFamily,
                        fontSize: settings.editor && settings.editor.fontSize,
                        uiFontFamily: settings.appearance.uiFontFamily,
                        uiFontSize: settings.appearance.uiFontSize
                    }, false);
                }
                if (window.SchemaCompare && typeof window.SchemaCompare.applyTypography === 'function') {
                    window.SchemaCompare.applyTypography();
                }
                if (window.SchemaCompare && typeof window.SchemaCompare.checkBravoExtensionStatus === 'function') {
                    window.SchemaCompare.checkBravoExtensionStatus();
                }
            } catch (e) { }
        };

        document.addEventListener('DOMContentLoaded', async function () {
            // Restore UI Typography immediately
            if (window.TypographyManager && typeof window.TypographyManager.init === 'function') {
                window.TypographyManager.init();
            }

            // Standalone Pop-out mode initialization
            if (window.SchemaCompare) {
                var opts = {
                    containerId: 'schema-compare-standalone-root',
                    isPopout: true
                };

                try {
                    var api = await (window.waitForPywebview ? window.waitForPywebview() : null);
                    if (api && typeof api.get_initial_options === 'function') {
                        var initOpts = await api.get_initial_options();
                        if (initOpts && typeof initOpts === 'object') {
                            if (initOpts.sourceConnId) opts.sourceConnId = initOpts.sourceConnId;
                            if (initOpts.sourceDb) opts.sourceDb = initOpts.sourceDb;
                            if (initOpts.sourceSchema) opts.sourceSchema = initOpts.sourceSchema;
                            if (initOpts.targetConnId) opts.targetConnId = initOpts.targetConnId;
                            if (initOpts.targetDb) opts.targetDb = initOpts.targetDb;
                            if (initOpts.targetSchema) opts.targetSchema = initOpts.targetSchema;
                        }
                    }
                } catch (e) {
                    console.warn('[SchemaCompare Window] get_initial_options error:', e);
                }

                // Fallback to URL query params if any
                var urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('sourceConnId')) opts.sourceConnId = urlParams.get('sourceConnId');
                if (urlParams.get('sourceDb')) opts.sourceDb = urlParams.get('sourceDb');
                if (urlParams.get('sourceSchema')) opts.sourceSchema = urlParams.get('sourceSchema');
                if (urlParams.get('targetConnId')) opts.targetConnId = urlParams.get('targetConnId');
                if (urlParams.get('targetDb')) opts.targetDb = urlParams.get('targetDb');
                if (urlParams.get('targetSchema')) opts.targetSchema = urlParams.get('targetSchema');

                window.SchemaCompare.init(opts);
            }
        });
    </script>
</body>

</html>
